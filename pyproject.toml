# Tool settings only: the project runs from source, it is not installed as a package (see requirements.txt).

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["runs", "build", "testdata/archive", "testdata/raw"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, bugbear, import order
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "cases", "llm", "mock_nas", "score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists every skip and expected failure with its reason; --strict-markers refuses a misspelt marker.
# pytest-randomly shuffles the order on every run (replay a run with --randomly-seed=<seed>);
# pytest-timeout fails any test that runs past `timeout` seconds.
addopts = "-m 'not live' -ra --strict-markers"
timeout = 90
xfail_strict = true
# Unmarked tests are unit tests. Mark the others so the split can be counted (see .github/workflows/tests.yml).
markers = [
    "integration: the project's own parts together, through an entry point (agent loop, CLI, package build)",
    "live: calls a local model server; skipped unless run with -m live",
]

[tool.coverage.run]
source = ["harness"]
branch = true

[tool.codespell]
skip = "*.png,*.jpg,*.gif,*.svg,*.json,*.jsonl,*.lock,.git,.venv,runs,build,testdata/archive,testdata/raw"
ignore-words-list = "ser,fo,te"

[tool.coverage.report]
# The decision core: the scorer, the stand-in CLI layer with its approval gate, the agent loops and the case table.
# harness/llm.py is the model client; harness/run.py and build_index.py need a model server. They are outside the figure.
include = ["*/harness/score.py", "*/harness/mock_nas.py", "*/harness/agents.py", "*/harness/cases.py", "*/harness/replay.py"]
fail_under = 85
show_missing = true

[tool.mypy]
files = ["harness", "tools", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
warn_unused_ignores = true
