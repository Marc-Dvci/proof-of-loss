<!doctype html>
<html><head><meta charset="utf-8"><title>inventory strip</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1200px; height: 800px; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #17211c;
         display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; align-items: center; gap: 14px; padding: 0 56px; margin: 9px 0; }
  .label { width: 150px; flex: none; }
  .label b { display: block; font-size: 17px; font-weight: 650; }
  .label span { font-size: 12.5px; color: #66736c; }
  figure { margin: 0; width: 176px; flex: none; }
  img { width: 176px; height: 132px; object-fit: cover; border-radius: 6px; display: block; }
  figcaption { font-size: 11.5px; color: #66736c; margin-top: 5px; }
  figcaption em { font-style: normal; color: #0f8a55; }
  .gap { width: 176px; height: 132px; flex: none; display: flex; align-items: center; justify-content: center;
         color: #a7b2ac; font-size: 12.5px; text-align: center; background: radial-gradient(#f3f6f4, #ffffff 72%); }
</style></head>
<body>
<!-- Paths point at the generated test archive; render after testdata/gen_photos.py -->
<div class="row">
